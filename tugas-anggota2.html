<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas Anggota 2 - [Nama Kelas] - Digital Kreatif</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --text-color: #1f2937;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.75;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 48px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }
    .nav-back {
      margin-bottom: 24px;
    }
    .nav-back a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .nav-back a:hover {
      text-decoration: underline;
    }
    h1 {
      font-size: 2rem;
      line-height: 1.3;
      color: #0f172a;
      margin-bottom: 20px;
    }
    .meta-box {
      background-color: #f8fafc;
      border-left: 4px solid var(--primary-color);
      padding: 16px 20px;
      border-radius: 4px;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .meta-box p {
      margin: 4px 0;
    }
    .content-area {
      min-height: 300px;
      padding: 20px 0;
    }
    .placeholder-text {
      color: #94a3b8;
      font-style: italic;
      text-align: center;
      margin-top: 50px;
    }
    /* Gaya Footer Akademis */
    .academic-footer {
      margin-top: 60px;
      padding-top: 36px;
      border-top: 1px solid #e2e8f0;
      color: #64748b;
      font-size: 0.88rem;
    }
    .footer-top {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      margin-bottom: 28px;
    }
    .footer-col h4 {
      font-size: 0.95rem;
      color: #0f172a;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .footer-col p {
      margin: 4px 0;
      line-height: 1.5;
    }
    .footer-col .sub-text {
      font-size: 0.82rem;
      color: #94a3b8;
    }
    .footer-links a, .footer-bottom a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .footer-bottom {
      border-top: 1px solid #f1f5f9;
      padding-top: 20px;
      text-align: center;
      font-size: 0.82rem;
    }

    /* --- Gaya Tombol Navigasi Back yang Menarik --- */
    .nav-back {
      margin-bottom: 30px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ffffff, #f1f5f9);
      color: #334155;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 10px 20px;
      border-radius: 99px; /* Bentuk kapsul (pill) */
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
    }
    .btn-back:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border-color: #2563eb;
      transform: translateX(-5px); /* Efek tombol bergeser sedikit ke kiri saat disorot */
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
    }
    /* Gaya untuk ikon panah SVG */
    .btn-back svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }
    .btn-back:hover svg {
      transform: translateX(-4px); /* Panah ikut bergeser ke kiri di dalam tombol */
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-back">
      <a href="index.html" class="btn-back">
        <!-- Ikon panah kiri (SVG) -->
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg>
        Kembali ke Beranda
      </a>
    </div>

    <h1>[Judul Artikel Anggota 2]</h1>

    <!-- Informasi Anggota -->
    <div class="meta-box">
      <p><strong>Oleh:</strong> Raden Jihaad F I A</p>
      <p><strong>NIM:</strong> 19230765</p>
      <p><strong>Mata Kuliah:</strong> Digital Kreatif</p>
      <p><strong>Kelas:</strong> 19.7C.26</p>
    </div>

    <!-- Area Konten (Tempat menaruh isi tugas) -->
    <div class="content-area">
      <p class="placeholder-text">[Halaman ini masih kosong. Silakan tulis dan masukkan konten tugas Anda di sini...]</p>
    </div>
  </div>

</body>
</html>
